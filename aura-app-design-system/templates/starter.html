<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{화면 제목} · AURA</title>
  <link rel="stylesheet" href="../assets/tokens.css"/>
  <link rel="stylesheet" href="../assets/base.css"/>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"/>
</head>
<body>

  <!-- Logo symbol — 페이지에 한 번만 선언, 어디서든 <use href="#aura"/>로 꺼내 씀 -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <defs>
      <linearGradient id="aura-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#6B5BFF"/>
        <stop offset=".55" stop-color="#8E76FF"/>
        <stop offset="1" stop-color="#34D2FF"/>
      </linearGradient>
    </defs>
    <symbol id="aura" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="28" fill="url(#aura-grad)"/>
      <path d="M22 42 L32 18 L42 42 M26.5 33 H37.5"
            stroke="#fff" stroke-width="3.5" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <main class="shell" style="padding:24px 0;display:grid;place-items:center;">
    <div class="phone">
      <div class="screen">
        <div class="statusbar"><span>9:41</span><span>●●●</span></div>

        <!-- 화면 본문 영역 — 여기에 references/patterns.md의 패턴을 복사해 넣으세요 -->
        <main style="flex:1;overflow-y:auto;">
          <section class="aurora-hero" style="margin:16px;">
            <h1>안녕하세요, {이름} 님</h1>
            <div class="sub">{서브 카피 — 일정/메일 수치}</div>
          </section>

          <div class="stack-v" style="padding:0 16px 80px;">
            <!-- 카드들 -->
          </div>
        </main>

        <!-- 하단 5탭 (표준) -->
        <nav class="app-tabs">
          <button class="tab on">
            <svg viewBox="0 0 24 24"><path d="M3 12 12 3l9 9M5 10v10h4v-6h6v6h4V10"/></svg>
            홈
          </button>
          <button class="tab">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>
            뉴스
          </button>
          <button class="tab">
            <svg viewBox="0 0 24 24"><path d="M3 7l9 6 9-6M3 7v10h18V7"/></svg>
            메일
          </button>
          <button class="tab">
            <svg viewBox="0 0 24 24"><use href="#aura"/></svg>
            Aura
          </button>
          <button class="tab">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.4.9a7 7 0 0 0-2.1-1.2L14 3h-4l-.4 2.5a7 7 0 0 0-2.1 1.2l-2.4-.9-2 3.5 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.5 2.4-.9c.6.5 1.3.9 2.1 1.2L10 21h4l.4-2.5c.8-.3 1.5-.7 2.1-1.2l2.4.9 2-3.5-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>
            설정
          </button>
        </nav>
      </div>
    </div>
  </main>

</body>
</html>
