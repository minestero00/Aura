<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{문서 제목} · AURA</title>
  <link rel="stylesheet" href="../assets/tokens.css"/>
  <link rel="stylesheet" href="../assets/base.css"/>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"/>
</head>
<body style="background:var(--white);">

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <defs>
      <linearGradient id="aura-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#6B5BFF"/>
        <stop offset=".55" stop-color="#8E76FF"/>
        <stop offset="1" stop-color="#34D2FF"/>
      </linearGradient>
    </defs>
    <symbol id="aura" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="28" fill="url(#aura-grad)"/>
      <path d="M22 42 L32 18 L42 42 M26.5 33 H37.5"
            stroke="#fff" stroke-width="3.5" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <main class="shell" style="max-width:680px;padding:48px 24px 80px;">
    <header style="display:flex;align-items:center;gap:12px;margin-bottom:32px;">
      <svg style="width:36px;height:36px;"><use href="#aura"/></svg>
      <h1 class="t-h1">AURA</h1>
    </header>

    <article class="stack-v">
      <h2 class="t-h2">{문서 제목}</h2>
      <p class="t-body">{본문}</p>
    </article>

    <footer style="margin-top:64px;color:var(--gray-600);font-size:12px;text-align:center;">
      © AURA · Ai for User Reliable Assistant
    </footer>
  </main>

</body>
</html>
