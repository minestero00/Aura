pluginManagement { includeBuild("../../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url("../../node_modules/@react-native-async-storage/async-storage/android/local_repo") }
        maven { url("../../node_modules/@notifee/react-native/android/libs") }
        // react-native-seoul/kakao-login이 요구하는 Kakao SDK는 Kakao 자체
        // maven repo에서만 제공. first-time Android 빌드에서 dependency
        // resolution 실패하던 원인.
        maven { url "https://devrepo.kakao.com/nexus/content/groups/public/" }
    }
}

rootProject.name = 'AuraApp'
include ':app'
includeBuild('../../node_modules/@react-native/gradle-plugin')
