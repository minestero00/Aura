apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-api
  labels:
    app: aura-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aura-api
  template:
    metadata:
      labels:
        app: aura-api
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/aura-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: ENABLE_BRIEFING_SCHEDULER
              value: "false"
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: database_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: redis_url
            - name: GOOGLE_WEB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: google_web_client_id
            - name: GOOGLE_IOS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: google_ios_client_id
            - name: GOOGLE_ANDROID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: google_android_client_id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: google_client_secret
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: google_maps_api_key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: anthropic_api_key
            - name: ANTHROPIC_MODEL
              value: claude-sonnet-4-20250514
            - name: APP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: app_encryption_key
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
