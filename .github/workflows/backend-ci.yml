name: backend-ci

on:
  push:
    paths:
      - "back/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "back/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build backend
        run: npm run build --workspace back

      - name: Typecheck frontend
        run: npm run typecheck --workspace front

      - name: Build backend Docker image
        run: docker build -f back/Dockerfile -t aura-back:ci .
