name: backend-ci

on:
  push:
    paths:
      - "back/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "back/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://aura:aura@127.0.0.1:5432/aura
      REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aura -d aura"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build backend
        run: npm run build --workspace back

      - name: Run migrations
        run: npm run migrate --workspace back

      - name: Usage smoke test
        run: npm run smoke:usage --workspace back

      - name: Typecheck frontend
        run: npm run typecheck --workspace front

      - name: Build backend Docker image
        run: docker build -f back/Dockerfile -t aura-back:ci .
