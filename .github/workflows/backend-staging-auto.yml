name: backend-staging-auto

on:
  push:
    branches:
      - main
    paths:
      - "back/**"
      - "!back/**/*.md"
      - "deploy/k8s/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-staging-auto.yml"
      - ".github/workflows/backend-release.yml"

jobs:
  build_image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: back/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aura-back:${{ steps.meta.outputs.image_tag }}

  deploy_staging:
    needs: build_image
    uses: ./.github/workflows/backend-release.yml
    with:
      image_tag: ${{ needs.build_image.outputs.image_tag }}
      environment: staging
      namespace: aura
      run_migration: true
    secrets: inherit
