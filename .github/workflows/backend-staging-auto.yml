name: backend-staging-auto

# 현재 배포 경로는 Railway (manual/DEPLOY_DECISION.md). 이 워크플로우는
# main push 시 GHCR에 이미지를 미리 build/push 해두는 용도. K8s 자동 배포는
# DAU 10k+ 마이그레이션 트리거 도달 시 backend-release.yml workflow_dispatch로
# 별도 호출. KUBECONFIG_B64 secret은 그 시점에 등록.

on:
  push:
    branches:
      - main
    paths:
      - "back/**"
      - "!back/**/*.md"
      - "deploy/k8s/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-staging-auto.yml"
      - ".github/workflows/backend-release.yml"

jobs:
  build_image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: back/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aura-back:${{ steps.meta.outputs.image_tag }}
